name: Daily Geopolitical & Financial Assistant Update

on:
  schedule:
    - cron: '0 6 * * *' # Every morning at 09:00 AM Istanbul time (06:00 AM UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Scraper and Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          cd Web
          node fetch_and_analyze.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/data_parsed.json
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update daily morning bulletin [skip ci]" && git push)
