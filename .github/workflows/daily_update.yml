name: Daily Geopolitical & Financial Assistant Update

on:
  schedule:
    - cron: '0 6 * * *'  # Her gün 06:00 UTC = 09:00 TR
  workflow_dispatch: # Manuel tetikleme veya cron-job.org backup

permissions:
  contents: write

jobs:
  update-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Scraper and Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          node fetch_and_analyze.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_parsed.json
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update daily morning bulletin [skip ci]" && git push)
